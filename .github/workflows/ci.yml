name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Board scripts parse
        run: bash -n tools/board && bash -n tools/goal

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Backend (functions, api/, ai/) tests and typecheck
        if: hashFiles('package.json') != ''
        env:
          MINDCODE_FAKE_LLM: "1"
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Web tests and build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci || npm install
          npm test --if-present
          npm run build --if-present
