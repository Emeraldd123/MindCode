name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Board scripts parse
        run: bash -n tools/board && bash -n tools/goal

      - name: Set up Python
        if: hashFiles('requirements.txt', 'api/requirements.txt', 'ai/requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python tests
        if: hashFiles('requirements.txt', 'api/requirements.txt', 'ai/requirements.txt') != ''
        run: |
          for f in requirements.txt api/requirements.txt ai/requirements.txt; do
            [ -f "$f" ] && pip install -r "$f"
          done
          pip install pytest
          python -m pytest -q || [ $? -eq 5 ]   # exit 5 = no tests collected yet

      - name: Set up Node
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Web tests and build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci || npm install
          npm test --if-present
          npm run build --if-present
